<!doctype html>
<!-- Página local empacotada no APK, exibida pelo server.errorPath quando o site não abre. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#173c30" />
<title>Mutum — sem conexão</title>
<style>
  :root{--green:#173c30;--cream:#f4f0e4;--paper:#fffcf4;--mustard:#d49b08;--ink:#1b2a23;--muted:#6f776e;--rust:#98563f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;min-height:100%;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));background:var(--green);color:var(--cream);font-family:Arial,"Segoe UI",sans-serif;text-align:center;overflow:hidden}
  body::after{content:"";position:fixed;width:310px;height:310px;border:1px solid rgba(244,240,228,.12);border-radius:50%;right:-170px;top:80px;box-shadow:0 0 0 55px rgba(244,240,228,.025),0 0 0 110px rgba(244,240,228,.018);pointer-events:none}
  .card{position:relative;z-index:1;width:min(380px,100%);background:var(--paper);color:var(--ink);border-radius:24px;padding:30px 24px 24px;box-shadow:0 18px 60px rgba(0,0,0,.24)}
  .mark{width:54px;height:54px;margin:0 auto 18px;border-radius:17px;background:var(--mustard);color:var(--green);display:grid;place-items:center;font:700 30px Georgia,serif}
  h1{font-family:Georgia,serif;font-size:25px;margin:0 0 8px}
  p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto 20px;max-width:290px}
  button{width:100%;height:52px;border:0;border-radius:14px;background:var(--mustard);color:#1f3028;font:700 15px Arial,sans-serif}
  button:disabled{opacity:.7}
  small{display:block;margin-top:14px;color:var(--rust);font-size:11px}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">m</div>
    <h1>Sem conexão</h1>
    <p>O Mutum precisa de internet para mostrar os mutirões e as trocas. Confira o Wi-Fi ou os dados móveis.</p>
    <button id="retry" type="button">Tentar de novo</button>
    <small>Quando a internet voltar, o Mutum reconecta sozinho.</small>
  </main>
<script>
  const appUrl = 'https://facincanitech.github.io/mutum/docs/'
  const button = document.getElementById('retry')
  function reconnect() { button.disabled = true; button.textContent = 'Reconectando…'; location.href = appUrl }
  button.addEventListener('click', reconnect)
  window.addEventListener('online', reconnect, { once: true })
</script>
</body>
</html>
